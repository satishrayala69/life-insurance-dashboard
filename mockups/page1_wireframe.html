<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 1 Wireframe - Executive Summary</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: #f4f7f6; 
        }
        .container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        /* Header Zone */
        .header { 
            background: #005A9C; 
            color: white; 
            padding: 20px; 
            text-align: center; 
            font-size: 24px; 
            font-weight: bold; 
            border-radius: 4px;
        }
        /* Filter Area Zone */
        .filters { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            background: #e0e0e0; 
            padding: 15px; 
            border: 1px solid #ccc; 
            align-items: center;
            border-radius: 4px;
        }
        .filter-box { 
            background: white; 
            padding: 5px 15px; 
            border: 1px solid #999; 
            border-radius: 4px; 
            cursor: pointer;
        }
        /* KPI Strip Zone */
        .kpi-strip { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            justify-content: space-between; 
        }
        .kpi-card { 
            flex: 1; 
            min-width: 140px; 
            background: white; 
            padding: 20px; 
            border: 1px solid #dcdcdc; 
            text-align: center; 
            border-radius: 4px; 
            box-shadow: 1px 1px 4px rgba(0,0,0,0.05); 
        }
        .kpi-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #555; }
        .kpi-card p { margin: 0; font-size: 22px; font-weight: bold; color: #333; }
        /* Chart Area Zone */
        .charts { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        .chart-box { 
            flex: 1; 
            min-width: 300px; 
            background: white; 
            padding: 20px; 
            border: 1px solid #dcdcdc; 
            border-radius: 4px; 
            min-height: 250px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #666; 
            text-align: center; 
            box-shadow: 1px 1px 4px rgba(0,0,0,0.05); 
        }
        /* Mobile Layout Stacking */
        @media (max-width: 768px) {
            .kpi-card, .chart-box { min-width: 100%; }
            .filters { flex-direction: column; align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- HEADER ZONE -->
        <div class="header">Executive Summary</div>
        
        <!-- FILTER AREA ZONE -->
        <div class="filters">
            <strong>Slicers:</strong>
            <div class="filter-box">Region ▾</div>
            <div class="filter-box">Channel ▾</div>
            <div class="filter-box">Year ▾</div>
        </div>

        <!-- KPI STRIP ZONE -->
        <div class="kpi-strip">
            <div class="kpi-card">
                <h3>APE YTD</h3>
                <p>$$$</p>
            </div>
            <div class="kpi-card">
                <h3>APE vs Target %</h3>
                <p>%</p>
            </div>
            <div class="kpi-card">
                <h3>Active Agents</h3>
                <p>#</p>
            </div>
            <div class="kpi-card">
                <h3>Persistency Rate</h3>
                <p>%</p>
            </div>
        </div>

        <!-- CHART AREA ZONE -->
        <div class="charts">
            <div class="chart-box">
                <div>
                    <strong>Monthly APE Trend</strong><br><br>
                    <em>(Line chart with Monthly APE + Target Line Overlay)</em>
                </div>
            </div>
            <div class="chart-box">
                <div>
                    <strong>Top 10 Agents by APE</strong><br><br>
                    <em>(Bar chart)</em>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
