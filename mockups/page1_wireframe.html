<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 1 Wireframe</title>
    <style>
        /* Basic page setup */
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            color: #333;
        }

        /* Gray background boxes to clearly show the zones */
        .zone { 
            border: 2px solid #666; 
            padding: 20px; 
            margin-bottom: 20px; 
            background-color: #f0f0f0; 
        }

        /* 1. Header Layout */
        .header-zone { 
            text-align: center; 
            background-color: #dcdcdc; 
        }

        /* 2. Filter Layout */
        .filter-zone { 
            display: flex; 
            gap: 15px; 
        }
        .filter-button {
            padding: 5px 15px;
            border: 1px solid #999;
            background: white;
        }

        /* 3. KPI Layout */
        .kpi-zone { 
            display: flex; 
            justify-content: space-between; 
            gap: 10px; 
        }
        .kpi-box { 
            border: 1px solid black; 
            padding: 20px; 
            width: 22%; 
            text-align: center; 
            background-color: white; 
        }

        /* 4. Chart Layout */
        .chart-zone { 
            display: flex; 
            gap: 20px; 
        }
        .chart-box { 
            border: 1px dashed black; 
            padding: 60px 20px; 
            width: 45%; 
            text-align: center; 
            background-color: white; 
        }
        
        /* Mobile layout: stack items on small screens */
        @media (max-width: 600px) {
            .kpi-zone, .chart-zone { flex-direction: column; }
            .kpi-box, .chart-box { width: auto; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <!-- ZONE 1: HEADER -->
    <div class="zone header-zone">
        <h1>Executive Summary</h1>
    </div>

    <!-- ZONE 2: FILTERS -->
    <div class="zone filter-zone">
        <strong>Slicers:</strong>
        <div class="filter-button">Region</div>
        <div class="filter-button">Channel</div>
        <div class="filter-button">Year</div>
    </div>

    <!-- ZONE 3: KPI STRIP -->
    <div class="zone kpi-zone">
        <div class="kpi-box">APE YTD<br><strong>[ Value ]</strong></div>
        <div class="kpi-box">APE vs Target %<br><strong>[ Value ]</strong></div>
        <div class="kpi-box">Active Agents<br><strong>[ Value ]</strong></div>
        <div class="kpi-box">Persistency Rate<br><strong>[ Value ]</strong></div>
    </div>

    <!-- ZONE 4: CHARTS -->
    <div class="zone chart-zone">
        <div class="chart-box">Monthly APE with Target (Line Chart)</div>
        <div class="chart-box">Top 10 Agents by APE (Bar Chart)</div>
    </div>

</body>
</html>
